<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segurança do PC</title>
<meta name="description" content="Checklist de configuração, revisões periódicas e resolução de problemas.">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Segurança PC">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1522" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{--bg:#F3F5F8;--surface:#FFFFFF;--ink:#16223A;--muted:#5C6A80;--line:#DCE2EA;--accent:#1F4E8C;--ok:#2E7D5B;--okbg:#E4F2EB;--warn:#94600F;--warnbg:#FBF0DC;--late:#B0343F;--latebg:#F8E3E5;--serif:ui-serif,"New York",Georgia,serif;--sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1522;--surface:#172033;--ink:#E6EBF3;--muted:#9AA7BC;--line:#2A3650;--accent:#8FB3EA;--ok:#6CC79C;--okbg:#16362A;--warn:#E6B25A;--warnbg:#3A2C12;--late:#EC8A93;--latebg:#3E1D22}}
:root[data-theme="dark"]{--bg:#0F1522;--surface:#172033;--ink:#E6EBF3;--muted:#9AA7BC;--line:#2A3650;--accent:#8FB3EA;--ok:#6CC79C;--okbg:#16362A;--warn:#E6B25A;--warnbg:#3A2C12;--late:#EC8A93;--latebg:#3E1D22}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 64px}
h1{font:600 1.85rem/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font:600 1.15rem/1.3 var(--serif);margin:0}
.lede{color:var(--muted);margin:0 0 20px;max-width:60ch}
.back{appearance:none;background:none;border:0;color:var(--accent);font:600 1rem var(--sans);padding:6px 0;margin:0 0 8px;cursor:pointer}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k{font-size:.85rem;color:var(--muted)}
.v{font:600 1.15rem/1.3 var(--serif);margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 .95rem var(--sans);padding:11px 14px;border-radius:9px;cursor:pointer;text-align:center}
.btn.line{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--late);border-color:var(--late)}
.btn:disabled{opacity:.45;cursor:default}
.sect-t{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 0 8px}
.job{display:block;width:100%;text-align:left;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--ink);font:inherit}
.job .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.job .code{font:600 1.1rem/1.3 var(--serif);overflow-wrap:anywhere}
.job .pc{font-size:.9rem;color:var(--muted);white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.st{display:inline-block;font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:8px}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.late{background:var(--latebg);color:var(--late)}
.st.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 1rem var(--sans);padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.box>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
details.box>summary::-webkit-details-marker{display:none}
.ph-t{font:600 1.05rem/1.3 var(--serif)}
.ph-c{font-size:.9rem;color:var(--muted);white-space:nowrap}
.ph-c.full{color:var(--ok)}
ul.items{list-style:none;margin:0;padding:0 16px 8px}
ul.items li{border-top:1px solid var(--line);padding:11px 0}
label.it{display:grid;grid-template-columns:24px 1fr;gap:10px;cursor:pointer}
label.it input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok)}
.it .tx{font-weight:600}
.it.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.it .dt{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.it .when{display:block;color:var(--ok);font-size:.85rem;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card ul.items{padding:0}
.meta{color:var(--muted);font-size:.9rem;margin:6px 0}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--muted);margin:20px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.search{width:100%;font:400 1rem var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:16px}
.cat{font-size:.85rem;color:var(--muted);font-weight:600;margin:18px 0 8px}
.g-t{font-weight:600;line-height:1.35}
.g-body{padding:0 16px 14px}
ol.steps{margin:0;padding-left:1.3em}
ol.steps li{margin:0 0 8px}
.g-note{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:10px}
.lvl{flex-shrink:0;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.lvl.tu{background:var(--okbg);color:var(--ok)}
.lvl.urgente{background:var(--warnbg);color:var(--warn)}
.lvl.pro{background:var(--latebg);color:var(--late)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.95rem;max-width:90vw;z-index:10}
@media (prefers-reduced-motion:no-preference){.toast{animation:t .2s ease-out}@keyframes t{from{opacity:0;transform:translate(-50%,8px)}}}
input[type=file]{display:none}
code{font:.88em ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
code.cmd{white-space:normal;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.wide{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font:600 .95rem var(--sans);padding:10px 6px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
ul.plain{margin:6px 0 8px;padding-left:1.2em}
ul.plain li{margin:0 0 4px}
.lvl.nb{background:var(--okbg);color:var(--ok)}
.lvl.nm{background:var(--warnbg);color:var(--warn)}
.lvl.na{background:var(--latebg);color:var(--late)}
.chat{margin-bottom:14px}
.msg{border-radius:12px;padding:11px 14px;margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.msg.user{background:var(--accent);color:var(--surface);margin-left:auto}
.msg.assistant{background:var(--surface);border:1px solid var(--line)}
.msg.err{background:var(--latebg);color:var(--late)}
.msg.wait{color:var(--muted)}
textarea.ask,input.key{width:100%;font:400 1rem var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea.ask{min-height:88px;resize:vertical;display:block}
@media (max-width:480px){.summary{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>

var KEY='seg-pc-state-v2',OLDKEY='seg-pc-state-v1';
var root=document.getElementById('root');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function newJob(code){return {id:uid(),code:code,created:today(),archived:false,level:'m',done:{},revChecks:{},revLast:{}}}
function normJob(j){return {id:j.id||uid(),code:String(j.code||'Sem código').slice(0,24),created:j.created||today(),archived:!!j.archived,level:LV.hasOwnProperty(j.level)?j.level:'m',done:j.done||{},revChecks:j.revChecks||{},revLast:j.revLast||{}}}
function norm(s){s=s||{};return {version:2,jobs:(s.jobs||[]).map(normJob),lastExport:s.lastExport||null,lab:s.lab||{},updated:s.updated||0}}
function fromV1(o){var j=newJob('Trabalho 1');j.done=o.done||{};j.revChecks=o.revChecks||{};j.revLast=o.revLast||{};return j}
var state=norm({});
try{
 var raw=localStorage.getItem(KEY);
 if(raw)state=norm(JSON.parse(raw));
 else{var old=localStorage.getItem(OLDKEY);if(old){var o=JSON.parse(old);if(Object.keys(o.done||{}).length||Object.keys(o.revLast||{}).length){state.jobs.push(fromV1(o));state.lastExport=o.lastExport||null;persist()}}}
}catch(e){}
var view={screen:'home',jobId:null,tab:'config',q:'',etab:'niveis'};

// ---------- Utilidades ----------
function pad(n){return (n<10?'0':'')+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fmt(s){var d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function addMonths(s,m){var d=parse(s);var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function daysUntil(s){return Math.round((parse(s)-parse(today()))/86400000)}
function cmd(s){return esc(s).replace(/(manage-bde -status|manage-bde -[a-z]+(?: -[a-z]+)? C:(?: -TPMAndPIN)?|gpupdate \/force|tpm\.msc|msinfo32|gpedit\.msc|optionalfeatures)/g,'<code>$1</code>')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function job(){for(var i=0;i<state.jobs.length;i++)if(state.jobs[i].id===view.jobId)return state.jobs[i];return null}
function plural(n,a,b){return n+(n===1?a:b)}

function revStatus(j,r){
 var last=j.revLast[r.id];
 if(!last)return {cls:'neutral',txt:'Ainda não feita',next:null,days:null,rank:0};
 var next=addMonths(last,r.months),d=daysUntil(next);
 if(d<0)return {cls:'late',txt:'Atrasada '+plural(-d,' dia',' dias'),next:next,days:d,rank:3};
 if(d===0)return {cls:'warn',txt:'É hoje',next:next,days:d,rank:2};
 if(d<=7)return {cls:'warn',txt:'Faltam '+plural(d,' dia',' dias'),next:next,days:d,rank:2};
 return {cls:'ok',txt:'Em dia, faltam '+d+' dias',next:next,days:d,rank:1};
}
function counts(j){var e=0,ed=0,o=0,od=0;PHASES.forEach(function(p){p.items.forEach(function(i){if(!essential(j,i)){o++;if(j.done[i[0]])od++}else{e++;if(j.done[i[0]])ed++}})});return {e:e,ed:ed,o:o,od:od}}
function jobReview(j){
 var best=null;
 REVIEWS.forEach(function(r){var s=revStatus(j,r);if(s.next!==null&&(best===null||s.days<best.s.days))best={r:r,s:s}});
 if(!best)return {cls:'neutral',txt:'Revisões por começar',rank:0,v:'Por marcar',k:'Regista a primeira revisão mensal quando acabares a configuração'};
 var n=best.r.t.replace('Revisão ','');
 return {cls:best.s.cls,txt:n.charAt(0).toUpperCase()+n.slice(1)+': '+best.s.txt.charAt(0).toLowerCase()+best.s.txt.slice(1),rank:best.s.rank,v:n.charAt(0).toUpperCase()+n.slice(1)+', '+fmt(best.s.next),k:best.s.txt};
}
function hasProgress(){return state.jobs.some(function(j){return Object.keys(j.done).length||Object.keys(j.revLast).length})}
function backupStatus(){
 if(!state.lastExport)return hasProgress()?{cls:'late',txt:'Ainda sem cópia'}:{cls:'neutral',txt:'Nada para copiar ainda'};
 var ago=-daysUntil(state.lastExport);
 if(ago>=30)return {cls:'warn',txt:'Última cópia há '+ago+' dias'};
 return {cls:'ok',txt:'Última cópia a '+fmt(state.lastExport)};
}

function aiSystem(j){
 var base='És o assistente da app Segurança do PC. Quem te usa configura e mantém a segurança de PCs de trabalho com Windows: BitLocker, Bitwarden, YubiKey, backups, comunicações e continuidade. Respondes em português de Portugal, de forma direta e prática, com passos numerados quando ajudar. Texto simples: sem tabelas nem cabeçalhos.\n\n'+
  'Privacidade: os trabalhos identificam-se só por códigos. Nunca peças nomes, emails, NIF, moradas, passwords, PINs, chaves de recuperação nem códigos de 2FA. Se o utilizador escrever algum destes dados, diz-lhe para não o fazer, não o repitas e responde de forma genérica.\n\n'+
  'Se a situação envolver ransomware, dados de clientes expostos ou risco de perder dados sem backup, diz claramente que é caso para um profissional e o que fazer entretanto. Se não tiveres a certeza de um passo concreto do Windows, diz isso em vez de inventar.\n\n'+
  'O conteúdo da app, que deves usar como referência e manter coerente:\n\n'+appText();
 var sys=[{type:'text',text:base,cache_control:{type:'ephemeral'}}];
 if(j){

  var rv=REVIEWS.map(function(r){return r.t+': '+revStatus(j,r).txt}).join('; ');
  sys.push({type:'text',text:'A conversa é sobre o trabalho com o código '+j.code+', com nível de proteção '+LVNAME[j.level||'m'].toLowerCase()+'.\nPassos feitos: '+(feitos.join('; ')||'nenhum')+'.\nPassos por fazer: '+(falta.join('; ')||'nenhum')+'.\nRevisões: '+rv+'.'});
 }
 return sys;
}

function sensitive(t){
 if(/\b\d{6}(?:[-\s]\d{6}){7}\b/.test(t))return 'block';
 if(/[^\s@]+@[^\s@]+\.[a-z]{2,}/i.test(t)||/(?:\+351[\s-]?)?\b9\d{2}[\s-]?\d{3}[\s-]?\d{3}\b/.test(t)||/\b[1-35689]\d{8}\b/.test(t)||/\bsk-ant-/i.test(t))return 'warn';
 return '';
}
function chatEl(role,text){var c=document.getElementById('chat');if(!c)return null;var e=c.querySelector('.empty');if(e)e.remove();var d=document.createElement('div');d.className='msg '+role;d.textContent=text;c.appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'});return d}

 if(s==='block'){toast('Isto parece uma chave de recuperação do BitLocker. Não a envies.');return}
 if(s==='warn'&&!confirm('A pergunta parece ter um email, telefone, NIF ou chave. Enviar mesmo assim?'))return;
 if(!navigator.onLine){toast('Sem internet. O assistente precisa de rede, os guias funcionam offline.');return}
 ai.msgs.push({role:'user',content:q});ai.draft='';ai.busy=true;render();
 var out=chatEl('assistant wait','A pensar…');
 var blocks=[],stop=null,textSoFar='';
 function fail(msg){ai.msgs.pop();ai.draft=q;ai.busy=false;render();chatEl('err',msg)}
 fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
   'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01',
   'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:MODEL,max_tokens:16000,stream:true,fallbacks:'default',output_config:{effort:'medium'},system:ai.sys,messages:ai.msgs})
 }).then(function(res){
  if(!res.ok)return res.text().then(function(t){var m='';try{m=JSON.parse(t).error.message}catch(e){}
   if(res.status===401)throw new Error('A chave foi recusada. Confirma-a ou cria outra na consola da Anthropic.');
   if(res.status===429)throw new Error('Demasiados pedidos ou limite de gasto atingido. Tenta daqui a pouco.');
   if(res.status===529||res.status>=500)throw new Error('O serviço está sobrecarregado. Tenta outra vez daqui a pouco.');
   throw new Error('Erro '+res.status+(m?': '+m:''))});
  var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
  function handle(ev){
   if(ev.type==='content_block_start'){blocks[ev.index]=JSON.parse(JSON.stringify(ev.content_block))}
   else if(ev.type==='content_block_delta'){var b=blocks[ev.index],d=ev.delta;if(!b)return;
    if(d.type==='text_delta'){b.text=(b.text||'')+d.text;textSoFar+=d.text;if(out){out.className='msg assistant';out.textContent=textSoFar}}
    else if(d.type==='thinking_delta')b.thinking=(b.thinking||'')+d.thinking;
    else if(d.type==='signature_delta')b.signature=(b.signature||'')+d.signature}
   else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;
   else if(ev.type==='error')throw new Error((ev.error&&ev.error.message)||'Erro durante a resposta.');
  }
  function pump(){return reader.read().then(function(r){
   if(r.done)return;
   buf+=dec.decode(r.value,{stream:true});
   var parts=buf.split('\n\n');buf=parts.pop();
   parts.forEach(function(p){p.split('\n').forEach(function(line){if(line.indexOf('data:')===0){var js=line.slice(5).trim();if(js)handle(JSON.parse(js))}})});
   return pump();
  })}
  return pump();
 }).then(function(){
  if(stop==='refusal'){fail('A IA recusou responder a esta pergunta. Reformula-a de forma mais genérica.');return}
  var content=blocks.filter(Boolean);
  if(!content.length){fail('A resposta veio vazia. Tenta outra vez.');return}
  ai.msgs.push({role:'assistant',content:content});ai.busy=false;render();
  if(stop==='max_tokens')chatEl('err','A resposta foi cortada por ser demasiado longa. Pede para continuar.');
  var c=document.getElementById('chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'end'});
 }).catch(function(e){fail(e&&e.message&&e.name!=='TypeError'?e.message:'Não foi possível contactar a IA. Verifica a internet.')});
}

// ---------- Estado da app ----------
var stat={running:false,rows:null,when:null};
function row(t,cls,txt,d){return {t:t,cls:cls,txt:txt,d:d||''}}
function safe(p,t){return Promise.resolve().then(p).catch(function(){return row(t,'warn','Não foi possível verificar','Tenta outra vez.')})}
function swInfo(){return new Promise(function(res){
 var c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!c)return res(null);
 var ch=new MessageChannel(),done=false;ch.port1.onmessage=function(e){done=true;res(e.data)};
 c.postMessage({type:'info'},[ch.port2]);setTimeout(function(){if(!done)res(null)},2500);
})}
function checkMode(){
 var sa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 return sa?row('Modo de abertura','ok','App instalada','Os dados ficam na app do ecrã principal.'):row('Modo de abertura','warn','Aberta no navegador','No iPhone, o Safari e a app instalada guardam os dados em sítios diferentes. Usa sempre o ícone.');
}
function checkOffline(){
 var T='Funciona sem rede';
 if(!('serviceWorker' in navigator)||!window.caches)return row(T,'late','Não suportado','Este navegador não permite o modo offline.');
 return swInfo().then(function(info){
  if(!info)return row(T,'late','Não preparada','Abre a app uma vez com internet, espera uns segundos e volta a verificar.');
  return caches.open(info.cache).then(function(c){return Promise.all(info.assets.map(function(a){return c.match(a)}))}).then(function(rs){
   var miss=rs.filter(function(r){return !r}).length,v=String(info.cache).replace('seg-pc-','');
   return miss?row(T,'warn',plural(miss,' ficheiro em falta',' ficheiros em falta'),'Abre a app com internet para completar. Versão '+v+'.'):row(T,'ok','Pronta',info.assets.length+' ficheiros guardados no iPhone. Versão '+v+'.');
  });
 });
}
function checkUpdate(){
 var T='Atualizações';
 if(!navigator.onLine)return row(T,'neutral','Sem rede','Liga a internet para verificar.');
 if(!('serviceWorker' in navigator))return row(T,'neutral','Não suportado','');
 return navigator.serviceWorker.getRegistration().then(function(reg){
  if(!reg)return row(T,'warn','Por instalar','Abre a app com internet e volta a verificar.');
  return reg.update().then(function(){
   return (reg.installing||reg.waiting)?row(T,'warn','Versão nova a instalar','Fecha a app e volta a abri-la daqui a uns segundos.'):row(T,'ok','Em dia','Tens a versão mais recente.');
  });
 });
}
function checkStorage(){
 var T='Gravação dos dados',ok=false;
 try{localStorage.setItem('seg-pc-test','1');ok=localStorage.getItem('seg-pc-test')==='1';localStorage.removeItem('seg-pc-test')}catch(e){}
 if(!ok)return row(T,'late','Não grava','O iPhone não está a deixar guardar. Verifica o espaço livre.');
 var n=plural(state.jobs.length,' trabalho guardado',' trabalhos guardados')+' neste dispositivo.';
 if(!(navigator.storage&&navigator.storage.estimate))return row(T,'ok','A gravar',n);
 return navigator.storage.estimate().then(function(e){return row(T,'ok','A gravar',n+(e&&e.usage?' Ocupa cerca de '+Math.max(1,Math.round(e.usage/1024))+' KB.':''))});
}
function checkBackup(){var b=backupStatus();return row('Cópia do progresso',b.cls,b.txt,b.cls==='ok'?'Exporta outra vez depois de cada revisão.':'Exporta em Cópia do progresso, no ecrã inicial, e guarda o ficheiro fora do iPhone.')}
function checkReviews(){
 var T='Revisões',act=state.jobs.filter(function(j){return !j.archived});
 if(!act.length)return row(T,'neutral','Sem trabalhos ativos','');
 var late=[],soon=[];
 act.forEach(function(j){var r=jobReview(j);if(r.rank===3)late.push(j.code);else if(r.rank===2)soon.push(j.code)});
 if(late.length)return row(T,'late',plural(late.length,' trabalho atrasado',' trabalhos atrasados'),late.join(', '));
 if(soon.length)return row(T,'warn',plural(soon.length,' para esta semana',' para esta semana'),soon.join(', '));
 return row(T,'ok','Em dia','Nenhuma revisão atrasada.');
}
function checkNet(){return navigator.onLine?row('Internet','ok','Ligada',''):row('Internet','neutral','Sem rede','A app funciona na mesma. Só o assistente e as atualizações precisam de rede.')}
function checkAI(){
 var T='Assistente IA',k=getKey();
 if(!k)return row(T,'neutral','Sem chave','Para o usar, cola a chave em Perguntar à IA.');
 if(!navigator.onLine)return row(T,'neutral','Sem rede','Chave guardada. O teste precisa de internet.');
 // Consulta o modelo sem gerar texto: confirma chave e acesso sem gastar crédito.
 return fetch('https://api.anthropic.com/v1/models/'+MODEL,{headers:{'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}}).then(function(r){
  if(r.ok)return row(T,'ok','Operacional','Chave válida e modelo disponível. Confirma o saldo na consola da Anthropic, que este teste não o vê.');
  if(r.status===401)return row(T,'late','Chave recusada','Cria uma chave nova na consola da Anthropic e substitui-a em Perguntar à IA.');
  if(r.status===403)return row(T,'late','Sem permissão','A chave não tem acesso a este modelo.');
  if(r.status===404)return row(T,'warn','Modelo indisponível','A conta não tem acesso ao modelo usado pela app.');
  return row(T,'warn','Erro '+r.status,'Tenta outra vez mais tarde.');
 },function(){return row(T,'warn','Sem ligação','Não foi possível contactar a Anthropic.')});
}
function runStatus(){
 if(stat.running)return;stat.running=true;render();
 var checks=[[checkMode,'Modo de abertura'],[checkOffline,'Funciona sem rede'],[checkUpdate,'Atualizações'],[checkStorage,'Gravação dos dados'],[checkBackup,'Cópia do progresso'],[checkReviews,'Revisões'],[checkNet,'Internet'],[checkAI,'Assistente IA']];
 Promise.all(checks.map(function(c){return safe(c[0],c[1])})).then(function(rows){stat.rows=rows;stat.when=new Date();stat.running=false;if(view.screen==='status')render()});
}
function statusHTML(){
 var h='<button class="back" id="back" data-act="home">‹ Trabalhos</button><h1>Estado da app</h1>';
 if(!stat.rows||stat.running&&!stat.rows)return h+'<p class="lede">A verificar…</p>';
 var bad=stat.rows.filter(function(r){return r.cls==='late'}).length,warn=stat.rows.filter(function(r){return r.cls==='warn'}).length;
 var s=bad?{cls:'late',txt:plural(bad,' problema',' problemas')+(warn?' e '+plural(warn,' aviso',' avisos'):'')}:warn?{cls:'warn',txt:plural(warn,' aviso',' avisos')}:{cls:'ok',txt:'Tudo operacional'};
 h+='<p class="lede">Verificado às '+pad(stat.when.getHours())+':'+pad(stat.when.getMinutes())+'.</p><div class="card"><h2>'+esc(s.txt)+'</h2><span class="st '+s.cls+'">'+(bad?'Precisa de atenção':warn?'Funciona, com avisos':'Pronta a usar')+'</span></div>';
 stat.rows.forEach(function(r){h+='<div class="card"><div class="top" style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span class="ph-t">'+esc(r.t)+'</span><span class="st '+r.cls+'" style="margin-top:0;white-space:nowrap">'+esc(r.txt)+'</span></div>'+(r.d?'<p class="meta" style="margin-bottom:0">'+esc(r.d)+'</p>':'')+'</div>'});
 h+='<div class="card"><h2>Verificar o próprio PC</h2><p class="meta">Esta página não consegue ver o PC. Para isso há um script que só lê o estado do Windows: TPM, Secure Boot, BitLocker com PIN, conta padrão, Defender, firewall, atualizações. Não altera nada, não usa a internet e não mostra nomes nem chaves.</p>';
 h+='<ol class="steps"><li>No PC, abre este endereço no browser e descarrega o script.</li><li>Botão direito no menu Iniciar, Terminal (Admin).</li><li>Escreve <code class="cmd">powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE\\Downloads\\verificar-pc.ps1" -Nivel Medio</code></li><li>Troca Medio por Baixo ou Alto conforme o nível do trabalho.</li><li>Para ter sempre a versão mais recente, em vez do browser descarrega pelo terminal: <code class="cmd">Invoke-WebRequest "'+esc(location.href.split(/[?#]/)[0].replace(/[^/]*$/,''))+'verificar-pc.ps1?v='+Date.now()+'" -OutFile "$env:USERPROFILE\\Downloads\\verificar-pc.ps1" -UseBasicParsing</code></li></ol>';
 h+='<div class="row"><a class="btn line" href="verificar-pc.ps1" download style="text-decoration:none">Descarregar script</a></div></div>';
 h+='<div class="row"><button class="btn" id="status-run" data-act="status-run"'+(stat.running?' disabled':'')+'>'+(stat.running?'A verificar…':'Verificar de novo')+'</button></div>';
 return h;
}

// ---------- Guardar, exportar, importar ----------
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
function save(){state.updated=Date.now();if(!persist())toast('Não foi possível guardar. Verifica o espaço livre.');render()}
var tt=null;
function toast(m){var o=document.querySelector('.toast');if(o)o.remove();var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove()},3200)}
function askCode(current){
 var v=prompt('Código do trabalho (sem nomes reais, até 24 caracteres):',current||'');
 if(v===null)return null;
 v=v.trim().slice(0,24);
 if(!v){toast('O código não pode ficar vazio.');return null}
 var clash=state.jobs.some(function(j){return j.code.toLowerCase()===v.toLowerCase()&&j.id!==view.jobId});
 if(clash){toast('Já existe um trabalho com esse código.');return null}
 return v;
}
function exportData(){
 var payload={app:'seguranca-pc',version:2,exported:today(),state:state};
 var name='seguranca-pc-'+today()+'.json',text=JSON.stringify(payload,null,1);
 var done=function(){state.lastExport=today();save();toast('Cópia exportada')};
 var file=null;try{file=new File([text],name,{type:'application/json'})}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
  navigator.share({files:[file],title:'Cópia do progresso'}).then(done).catch(function(err){if(!err||err.name!=='AbortError')download(text,name,done)});
 }else download(text,name,done);
}
function download(text,name,cb){
 var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
 var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(url)},4000);cb();
}
function importData(f){
 var r=new FileReader();
 r.onload=function(){
  var obj;try{obj=JSON.parse(r.result)}catch(e){toast('Este ficheiro não é uma cópia válida.');return}
  if(!obj||obj.app!=='seguranca-pc'||!obj.state){toast('Este ficheiro não é uma cópia desta app.');return}
  var when=obj.exported?' de '+fmt(obj.exported):'';
  if(obj.version===1||!obj.state.jobs){
   if(!confirm('Esta cópia'+when+' é da versão antiga, com um só trabalho. Adicioná-la como trabalho novo?'))return;
   var j=fromV1(obj.state),k=1;while(state.jobs.some(function(x){return x.code===j.code})){k++;j.code='Trabalho '+k}
   state.jobs.push(j);save();toast('Trabalho importado');return;
  }
  if(!confirm('Substituir todos os trabalhos atuais pela cópia'+when+'?'))return;
  var keep=state.lastExport;state=norm(obj.state);state.lastExport=state.lastExport||keep;view.screen='home';save();toast('Cópia importada');
 };
 r.onerror=function(){toast('Não foi possível ler o ficheiro.')};
 r.readAsText(f);
}

// ---------- Eventos ----------
root.addEventListener('change',function(e){
 var t=e.target,j=job();
 if(t.id==='file'){if(t.files&&t.files[0])importData(t.files[0]);t.value='';return}
 if(t.dataset.lab){if(t.checked)state.lab[t.dataset.lab]=today();else delete state.lab[t.dataset.lab];save();return}
 if(!j)return;
 if(t.dataset.step){if(t.checked)j.done[t.dataset.step]=today();else delete j.done[t.dataset.step];save()}
 else if(t.dataset.rev){var r=t.dataset.rev;j.revChecks[r]=j.revChecks[r]||{};if(t.checked)j.revChecks[r][t.dataset.ri]=true;else delete j.revChecks[r][t.dataset.ri];save()}
});
root.addEventListener('input',function(e){if(e.target.id==='q'){view.q=e.target.value;document.getElementById('guides').innerHTML=guidesHTML()}else if(e.target.id==='ask')ai.draft=e.target.value});
root.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 var a=b.dataset.act,j=job();
 if(b.dataset.open){view.tab='config';go('job',b.dataset.open)}
 else if(b.dataset.tab){view.tab=b.dataset.tab;render()}
 else if(b.dataset.etab){view.etab=b.dataset.etab;render()}
 else if(b.dataset.level&&j){if(j.level!==b.dataset.level){j.level=b.dataset.level;save();toast('Nível '+LVNAME[j.level].toLowerCase()+'. A checklist foi ajustada.')}}
 else if(b.dataset.log&&j){j.revLast[b.dataset.log]=today();j.revChecks[b.dataset.log]={};save();toast('Revisão registada')}
 else if(a==='home')go('home');
 else if(a==='help'){view.q='';go('help')}
 else if(a==='new'){view.jobId=null;var c=askCode('');if(c){var nj=newJob(c);state.jobs.push(nj);state.updated=Date.now();persist();go('job',nj.id)}}
 else if(a==='rename'&&j){var c2=askCode(j.code);if(c2){j.code=c2;save()}}
 else if(a==='archive'&&j){j.archived=!j.archived;state.updated=Date.now();persist();toast(j.archived?'Trabalho arquivado':'Trabalho reativado');go('home')}
 else if(a==='delete'&&j){if(confirm('Apagar o trabalho '+j.code+' e todo o histórico? Não dá para desfazer.')){state.jobs=state.jobs.filter(function(x){return x.id!==j.id});state.updated=Date.now();persist();go('home');toast('Trabalho apagado')}}
 else if(a==='ai'){if(ai.jobId!==null||!ai.sys)aiStart(null);go('ai')}
 else if(a==='status'){go('status');runStatus()}
 else if(a==='enc')go('enc');
 else if(a==='lab')go('lab');
 else if(a==='status-run')runStatus();
 else if(a==='ai-job'&&j){if(ai.jobId!==j.id||!ai.sys)aiStart(j.id);go('ai')}
 else if(a==='ai-new'){aiStart(ai.jobId);render()}
 else if(a==='send')aiSend();
 else if(a==='key-save'){var kv=(document.getElementById('key').value||'').trim();if(kv.indexOf('sk-ant-')!==0){toast('Isto não parece uma chave da Anthropic.');return}if(setKey(kv)){toast('Chave guardada neste iPhone');render()}else toast('Não foi possível guardar a chave.')}
 else if(a==='key-del'){if(confirm('Remover a chave da API deste iPhone? A conversa atual também é apagada.')){setKey('');aiStart(ai.jobId);render();toast('Chave removida')}}
 else if(a==='export')exportData();
 else if(a==='import')document.getElementById('file').click();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view.screen!=='help'&&!(view.screen==='ai'&&ai.busy))render()});

render();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
if('serviceWorker' in navigator){
 var hadSW=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW)toast('Versão nova instalada. Fecha e reabre a app.');hadSW=true});
 window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
